name: commercepilot
services:
  postgres:
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
    environment:
      POSTGRES_DB: commercepilot
      POSTGRES_USER: commercepilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/start.ps1 or create .env first}
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commercepilot -d commercepilot"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build:
      context: .
      dockerfile: src/Commerce.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Commerce: Host=postgres;Database=commercepilot;Username=commercepilot;Password=${POSTGRES_PASSWORD}
      Database__Initialize: "true"
      Chat__McpUrl: http://mcp:8080/mcp
      Chat__OllamaUrl: http://host.docker.internal:11434/
      Chat__Backend: ${CHAT_BACKEND:-langgraph}
      Chat__AgentUrl: http://agent:8080/
      Chat__AgentKey: ${AGENT_SHARED_KEY:?Run scripts/start.ps1 to initialize the internal agent key}
      DemoAccounts__AlexPassword: ${DEMO_ALEX_PASSWORD:?Run scripts/start.ps1 to initialize demo credentials}
      DemoAccounts__SamPassword: ${DEMO_SAM_PASSWORD:?Run scripts/start.ps1 to initialize demo credentials}
      DemoAccounts__AdminPassword: ${DEMO_ADMIN_PASSWORD:?Run scripts/start.ps1 to initialize the administrator}
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_healthy
  mcp:
    build:
      context: .
      dockerfile: src/Commerce.Mcp/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      AllowedHosts: localhost;127.0.0.1;[::1];mcp
      ConnectionStrings__Commerce: Host=postgres;Database=commercepilot;Username=commercepilot;Password=${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
  web:
    build:
      context: web
    environment:
      API_BASE_URL: http://api:8080
      APP_ORIGIN: http://localhost:3000
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
  agent:
    build:
      context: .
      dockerfile: tools/commerce-agent/Dockerfile
    environment:
      AGENT_SHARED_KEY: ${AGENT_SHARED_KEY}
      OLLAMA_URL: http://host.docker.internal:11434
    # Internal only: the browser uses the authenticated API and never this service.
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health', {headers: {Authorization: 'Bearer ' + process.env.AGENT_SHARED_KEY}}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  postgres_data:
