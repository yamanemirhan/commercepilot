name: commercepilot
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: commercepilot
      POSTGRES_USER: commercepilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/start.ps1 or create .env first}
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commercepilot -d commercepilot"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build:
      context: .
      dockerfile: src/Commerce.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Commerce: Host=postgres;Database=commercepilot;Username=commercepilot;Password=${POSTGRES_PASSWORD}
      Database__Initialize: "true"
      DemoAccounts__AlexPassword: ${DEMO_ALEX_PASSWORD:?Run scripts/start.ps1 to initialize demo credentials}
      DemoAccounts__SamPassword: ${DEMO_SAM_PASSWORD:?Run scripts/start.ps1 to initialize demo credentials}
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  mcp:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: src/Commerce.Mcp/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Commerce: Host=postgres;Database=commercepilot;Username=commercepilot;Password=${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
  web:
    build:
      context: web
    environment:
      API_BASE_URL: http://api:8080
      APP_ORIGIN: http://localhost:3000
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
volumes:
  postgres_data:
